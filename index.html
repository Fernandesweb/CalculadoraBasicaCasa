<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="calculator.js" defer></script>
    <title>Desafio 1 - Calculadora</title>
</head>

<body>
    <main>
        <form class="caixa">
            <h1 class="titulo">Calculadora Basica</h1>
            <input id="nb1" class="caixa-texto" type="number" placeholder="Digite um Numero!">
            <input id="nb2" class="caixa-texto" type="number" placeholder="Digite um Numero!">
            <div id="botao" class="botao">
                <Button id="botao-Soma" class="somar" type="button">Somar</Button>
                <Button id="botao-sub" class="subtrair" type="button">Subtrair</Button>
                <Button id="botao-mult" class="multiplicar" type="button">Multiplicar</Button>
                <Button id="botao-divi" class="dividir" type="button">Dividir</Button>
            </div>

            <div id="resultado" class="resultado">Valor Da Soma!</div>
        </form>
    </main>
</body>

</html>
